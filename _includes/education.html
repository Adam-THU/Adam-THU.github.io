<ul class="dated-list education-list">
  {% for entry in site.data.profile.education %}
  <li>
    <span class="education-period">{{ entry.period }}</span>
    <div><h3>{{ entry.qualification }}</h3><p>{{ entry.institution }} <span class="education-detail">{{ entry.detail }}</span></p></div>
  </li>
  {% endfor %}
</ul>
