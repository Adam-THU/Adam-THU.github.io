<!doctype html>
<html lang="{{ site.locale | slice: 0, 2 | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/monogram.svg' | relative_url }}">
    <link rel="preload" href="{{ '/assets/fonts/manrope.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.name }}<span lang="zh-Hans">董哲</span></a>
        <nav class="site-nav" aria-label="Main navigation">
          {% for item in site.data.navigation.main %}
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          {% endfor %}
        </nav>
      </header>
      <main id="main-content" class="site-main" tabindex="-1">
        {{ content }}
      </main>
      <footer class="site-footer">
        <span>&copy; {{ site.time | date: '%Y' }} {{ site.name }}</span>
        <span>Beijing, China <a href="mailto:{{ site.author.email }}">Get in touch</a></span>
      </footer>
    </div>
  </body>
</html>
