<!doctype html>
<html lang="{{ site.locale | slice: 0, 2 | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <meta name="theme-color" content="#f1f0e9">
    <script src="{{ '/assets/js/color-theme.js' | relative_url }}"></script>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/monogram.svg' | relative_url }}">
    <link rel="preload" href="{{ '/assets/fonts/manrope.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.name }}<span lang="zh-Hans">董哲</span></a>
        <nav class="site-nav" aria-label="Main navigation">
          {% for item in site.data.navigation.main %}
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          {% endfor %}
        </nav>
        <button id="color-theme-toggle" class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Switch to dark mode" hidden>
          <svg class="theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.8 13a8.5 8.5 0 0 1-9.8-9.8A8.5 8.5 0 1 0 20.8 13Z"/></svg>
          <svg class="theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.6"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>
      <main id="main-content" class="site-main" tabindex="-1">
        {{ content }}
      </main>
      <footer class="site-footer">
        <span>&copy; {{ site.time | date: '%Y' }} {{ site.name }}</span>
        <span>Beijing, China <a href="mailto:{{ site.author.email }}">Get in touch</a></span>
      </footer>
    </div>
  </body>
</html>
